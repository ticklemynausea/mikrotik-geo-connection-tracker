<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mikrotik Geo Connection Tracker</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="app"></div>
    <!-- Runtime config (LAN v6 prefix etc.). In Docker this file is written
         by docker/15-runtime-config.sh at container start; in dev it's the
         no-op stub from public/runtime-config.js. Must load before the
         bundle so window.__APP_CONFIG__ is defined when modules execute. -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
